[package]
name = "clipraft"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clipboard-rs = "0.3"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["elcapitan"] }
core-foundation = "0.10"
tauri-plugin-global-shortcut = "2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSBezierPath", "NSColor", "NSDraggingItem", "NSDraggingSession",
    "NSEvent", "NSFont", "NSGraphics", "NSImage", "NSPasteboard", "NSPasteboardItem",
    "NSResponder", "NSScreen", "NSStringDrawing", "NSParagraphStyle", "NSView", "NSWindow",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray", "NSAttributedString", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL",
    "NSProcessInfo",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.52", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
