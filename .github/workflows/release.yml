name: Release

# 双平台发布：推送 v* tag 后在 Windows 与 macOS 上构建安装包，
# 由 tauri-action 作为附件发布到对应 tag 的 GitHub Release。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          # 优先使用 bandit0x 的 PAT（RELEASE_TOKEN），使 release 归属真实账号；
          # 未配置该 secret 时回退到内置 token（归属 github-actions[bot]）。
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ github.ref_name }} — local-first multimodal clipboard companion for Windows and macOS. Captures text, images, and files as floating rafts docked at the screen edge; restore any card with a click, auto-paste into your previous app, or drag content straight into any window.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
